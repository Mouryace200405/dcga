name: Daily GitHub Archive

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch daily GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          DATE=$(date -u '+%Y-%m-%d')

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/search/repositories?q=created:$DATE&sort=stars&order=desc&per_page=20" \
            > "data/$DATE.json"

      - name: Commit archive
        run: |
          git config user.name "Mouryace200405"
          git config user.email "mouryachittibabu@gmail.com"
          git add data/
          git commit -m "data: daily GitHub archive $(date -u '+%Y-%m-%d')" || exit 0
          git push
